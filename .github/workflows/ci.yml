# CI runs on pull requests only (owner, 2026-08-25). It does NOT run on main:
# the same `bun run check` already ran locally inside scripts/release.sh
# BEFORE the release push, and .githooks/pre-push refuses a main push without
# proof of that run. A main-push CI run would only repeat it, after the deploy.
# Do not add `push: branches: [main]` back.
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check gate
        env:
          # Agent client construction needs a value; tests run against the
          # convex-test harness and never dial it.
          CONVEX_URL: http://127.0.0.1:3210
        run: bun run check
