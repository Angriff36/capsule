# Local SonarQube analysis for Capsule (http://localhost:9000).
# Run: SONAR_TOKEN=<user token> sonar-scanner
# Token lives in Cursor MCP env (SONARQUBE_TOKEN); do not commit tokens.

sonar.projectKey=capsule
sonar.projectName=Capsule
sonar.host.url=http://localhost:9000

sonar.sources=src,convex,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Exclude Manifest/Builder-generated trees (see AGENTS.md ownership).
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/.convex/**,\
**/src/generated/**,\
**/src/lib/manifest-convex-react.ts,\
**/convex/_generated/**,\
**/convex/schema.ts,\
**/convex/queries.ts,\
**/convex/mutations.ts,\
**/convex/http.ts,\
**/convex/crons.ts,\
**/convex/sagas.ts,\
**/convex/computed.ts,\
**/scripts/seed-convex.ts,\
**/generated/**,\
**/.artifacts/**,\
**/.loop-worktrees/**,\
**/graphify-out/**,\
**/schemas/**,\
**/wiring/**,\
**/diagrams/**

sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx
