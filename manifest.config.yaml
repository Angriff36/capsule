# Capsule Manifest project config (build-level).
# Schema: @angriff36/manifest/docs/spec/config/manifest.config.schema.json
#
# Convex authContextImport is required for tenant + policy IR (PB025).
# Builder convex-application preset v1.3.1 supplies the same option and emits
# convex/lib/authContext.ts as the author seam (identity not inlined into
# generated functions).

src: "src/**/*.manifest"
output: generated/ir

projections:
  convex:
    output: convex
    options:
      authContextImport: ./lib/authContext
      encryptionImport: ./lib/encryption
      eventHandlerImport: ./lib/operationalEvents
      # Org capability kill-switches: generated checkRole asks this seam
      # before the role hierarchy (roleAllows(user.role, ...) only).
      roleGateImport: ./lib/orgCapabilityGate
      policyMode: enforce
      includeTenantFilter: true
      # Fold resolved computeds into list/get returns (documented helpers|inline).
      # Default helpers requires callers to invoke convex/computed.ts; the event
      # menu UI reads estimatedCost/requiredCost/requiredBatches from listEvent rows.
      computedProperties: inline
      # Builder-only: stop emitting diagrams/** mermaid companions on regen.
      # Manifest still lists mermaid as a compatible companion; Capsule does not
      # want those files rebuilt (low product value / ownership noise).
      skipDocsDiagrams: true
      # Keep behavioral tests; omit generated function-existence checks.
      # Owner removed the 603 export-only smoke cases; do not regenerate them.
      skipContractTests: true
      # Composite indexes the domain needs but the grammar cannot declare.
      # StaffChatReadCursor: one row per (channel, account) — the upsert seam
      # convex/teamChatCursor.ts and every cursor read look the caller's row up
      # directly instead of filtering a channel-wide page.
      indexes:
        TppUpload:
          - fields: [tenantId, fingerprint]
            name: by_tenant_fingerprint
        TppUploadPart:
          - fields: [uploadId, sequence]
            name: by_upload_sequence
        # Personal swap lookup: current staff and matching evidence/windows,
        # without scanning the tenant's historical schedule or private records.
        Person:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        Shift:
          - fields: [tenantId, endsAt]
            name: by_tenantId_and_endsAt
          - fields: [tenantId, personId, status, endsAt]
            name: by_staff_status_end
        TimeOffRequest:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          - fields: [tenantId, personId, status, endsAt]
            name: by_staff_status_end
          # Approved time off of a date window (convex/workforceWindow.ts
          # approvedTimeOff), not every approved request ever made.
          - fields: [tenantId, status, endsAt]
            name: by_tenantId_and_status_and_endsAt
        Qualification:
          - fields: [tenantId, status, expiresAt]
            name: by_tenantId_and_status_and_expiresAt
          - fields: [tenantId, personId, status, name, expiresAt]
            name: by_staff_certification_expiry
        TrainingCompletion:
          - fields: [tenantId, personId, trainingModuleId]
            name: by_staff_training_module
        ShiftSwapRequest:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          - fields: [recipientPersonId, status]
            name: by_recipientPersonId_and_status
        StaffChatReadCursor:
          - fields: [channelKey, authSubjectId]
            name: by_channelKey_and_authSubjectId
        # Team-chat files: the seam reads a message's attachments by parent AND
        # uploader, so a row someone else parks on the message id is never read.
        Attachment:
          - fields: [parentId, uploadedById]
            name: by_parentId_and_uploadedById
        # Catalog rows hold their primary image's storage id directly. The
        # orphan-blob check (convex/lib/blobs.ts) must find them by that id
        # before it deletes an unreferenced upload.
        Dish:
          - fields: [primaryImageStorageId]
            name: by_primaryImageStorageId
        Ingredient:
          - fields: [primaryImageStorageId]
            name: by_primaryImageStorageId
        # The bell (convex/notifications.ts) reads only rows in an alerting
        # state, so an old open item is never cut off by newer closed ones.
        # Not staged: on production these tables are small (counted
        # 2026-10-07: inventoryItems 311, reviewFlags 17, vendorOrders 9,
        # shifts 8, deliveries 3, incidents 2, timeOffRequests 1,
        # qualifications 1, others 0), so the backfill is immediate and the
        # bell needs the indexes in the same deploy.
        Incident:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        VendorOrder:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          # Orders received since a date (vendor scores), not every order ever
          # received.
          - fields: [tenantId, status, receivedAt]
            name: by_tenantId_and_status_and_receivedAt
        ReviewFlag:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        EquipmentIssue:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          - fields: [equipmentId, status]
            name: by_equipmentId_and_status
        Delivery:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          # A van's clash check reads only its runs still to drive.
          - fields: [vehicleId, status]
            name: by_vehicleId_and_status
        InventoryItem:
          - fields: [tenantId, reorderThreshold]
            name: by_tenantId_and_reorderThreshold
        EquipmentMaintenanceTask:
          - fields: [tenantId, nextDueAt]
            name: by_tenantId_and_nextDueAt
        # Invoice numbers are unique per tenant; the numbering seam
        # (convex/lib/invoiceNumbering.ts) checks a proposed number with a point
        # lookup instead of reading the tenant's invoice history.
        # The Today page (convex/todayDesk.ts) counts open invoices, prep,
        # pack lists and draft closeouts by status instead of reading every
        # row of each table (PL-SCALE, AC-172).
        Invoice:
          - fields: [tenantId, invoiceNumber]
            name: by_tenantId_and_invoiceNumber
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          # Invoices dated in a window (issued, else created): revenue trends.
          - fields: [tenantId, issuedAt, createdAt]
            name: by_tenantId_and_issuedAt_and_createdAt
        PrepTask:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          # Prep due in a window (the Mangia board's day).
          - fields: [tenantId, dueAt]
            name: by_tenantId_and_dueAt
        PackList:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        EventCloseout:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          # Closeouts dated in a window (finalized, else captured, else
          # created): the scorecard and L10 dashboards.
          - fields: [tenantId, finalizedAt, capturedAt, createdAt]
            name: by_tenantId_and_finalizedAt_and_capturedAt_and_createdAt
        # One outside payment id is used by one payment, and one Capsule
        # payment is matched by one imported payment row (BE-15.2-01/04). The
        # seam (convex/lib/paymentAccounting.ts) checks with point lookups.
        Payment:
          - fields: [tenantId, externalPaymentId]
            name: by_tenantId_and_externalPaymentId
          - fields: [tenantId, matchedExternalId]
            name: by_tenantId_and_matchedExternalId
          # Payments settled in a month (finance overview).
          - fields: [tenantId, settledAt]
            name: by_tenantId_and_settledAt
        ExternalRecordLink:
          - fields: [tenantId, capsuleId]
            name: by_tenantId_and_capsuleId
          # Screens read only their kind of link (payment, menu, event, still
          # waiting). Scanning all links timed out /admin/reconcile
          # (2026-10-06); convex/externalRecordLinkLists.ts reads these.
          - fields: [tenantId, recordType]
            name: by_tenantId_and_recordType
          - fields: [tenantId, capsuleEntity]
            name: by_tenantId_and_capsuleEntity
          - fields: [tenantId, conflictStatus]
            name: by_tenantId_and_conflictStatus
        # Ingredient totals per event: every contribution reaction sums one
        # ingredient's rows in one event. Reading the whole event 13 times per
        # contribution passed Convex's 16 MB read limit on a 15-dish BEO
        # import (2026-09-24). Manifest reads each sum through the declared
        # index covering the most equality predicates, i.e. this one.
        # Public quote dedup: one point read per submit instead of scanning the
        # tenant's submissions (convex/quoteBuilder.ts ingressQuoteSubmission).
        QuoteSubmission:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
          - fields: [tenantId, dedupKey]
            name: by_tenantId_and_dedupKey
        EventIngredientContribution:
          - fields: [eventId, ingredientId]
            name: by_eventId_and_ingredientId
        # The events ledger (convex/eventLedger.ts) reads one date-ordered
        # window at a time instead of every event with its menu tree
        # (PL-SCALE, AC-172: 10,000 events per tenant).
        Event:
          - fields: [tenantId, startsAt]
            name: by_tenantId_and_startsAt
          - fields: [tenantId, endsAt]
            name: by_tenantId_and_endsAt
          - fields: [tenantId, stage, startsAt]
            name: by_tenantId_and_stage_and_startsAt
          # The notification bell (convex/notifications.ts) reads only the
          # events whose stage changed in the last seven days, not every
          # event (13 s at 10,000 events held up every screen).
          - fields: [tenantId, approvedAt]
            name: by_tenantId_and_approvedAt
          - fields: [tenantId, executionStartedAt]
            name: by_tenantId_and_executionStartedAt
          - fields: [tenantId, completedAt]
            name: by_tenantId_and_completedAt
          - fields: [tenantId, cancelledAt]
            name: by_tenantId_and_cancelledAt
          - fields: [tenantId, closedOutAt]
            name: by_tenantId_and_closedOutAt
        # A hold lookup and the expiry worker both begin with the tenant's
        # local calendar date. Status remains an in-memory filter so release
        # and expiry do not require a separate index per lifecycle state.
        DateHold:
          - fields: [tenantId, holdDate, expiresAt]
            name: by_tenantId_and_holdDate_and_expiresAt
        DateWaitlistEntry:
          - fields: [tenantId, holdDate, queuedAt]
            name: by_tenantId_and_holdDate_and_queuedAt
        # Date and state reads of convex/financeWindow.ts, workforceWindow.ts,
        # productionWindow.ts and recipeWindow.ts: a screen reads only the
        # rows of its window or state through these, never the company's whole
        # table filtered row by row (whole-table reads time out on the live
        # server, 2026-10-08). The status indexes of PurchaseNeed,
        # ImportConflict and LeadershipItem give their screens generated
        # by-status lists.
        # Not staged: on production every table these indexes cover is small
        # (counted 2026-10-08 with `convex data` on the box: leads 3357,
        # events 3347, invoices 3324, payments 3254, prepTasks 435,
        # ingredientDemands 200, purchaseNeeds 87, productionBatches 12,
        # timeRecords 13, proposals 11, every other one 0-2), so each backfill
        # takes seconds and the screens need the indexes in the same deploy.
        Lead:
          - fields: [tenantId, createdAt]
            name: by_tenantId_and_createdAt
          - fields: [tenantId, closedAt]
            name: by_tenantId_and_closedAt
        PayrollInput:
          - fields: [tenantId, periodStart]
            name: by_tenantId_and_periodStart
          # Every open row (draft, prepared, sent, viewed, scheduled, active)
          # of these screens through a status index, so an older open one is
          # never cut off by a page of newer finished ones.
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        Proposal:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        Contract:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        Tasting:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        MessageThread:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        RevenueAttribution:
          - fields: [tenantId, appliedAt]
            name: by_tenantId_and_appliedAt
        ClientOutreachTask:
          - fields: [tenantId, resolvedAt]
            name: by_tenantId_and_resolvedAt
        SyncError:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        TimeRecord:
          - fields: [tenantId, clockInAt]
            name: by_tenantId_and_clockInAt
        AvailabilityWindow:
          - fields: [tenantId, endsAt]
            name: by_tenantId_and_endsAt
        ProductionBatch:
          - fields: [tenantId, status, completedAt]
            name: by_tenantId_and_status_and_completedAt
          - fields: [tenantId, status, shortfallResolvedAt, shortfallQuantity]
            name: by_tenant_status_shortfall
        ProductionBatchAllocation:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        ComponentImport:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        PurchaseNeed:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        ImportConflict:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        LeadershipItem:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        # Equipment free-unit checks and Final Lock read only open holds and
        # problems and the vans still on an event, never every booking ever
        # made (a 575-guest event page timed out on live, 2026-10-08).
        EquipmentReservation:
          - fields: [equipmentId, status]
            name: by_equipmentId_and_status
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        # One person's work from yesterday on, and their forms not yet done
        # (My day-of forms), not everything they ever worked.
        EventAssignment:
          - fields: [personId, endsAt]
            name: by_personId_and_endsAt
        FieldConfirmation:
          - fields: [responsiblePersonId, status]
            name: by_responsiblePersonId_and_status
          - fields: [secondPersonId, status]
            name: by_secondPersonId_and_status
        EventVehicleAssignment:
          - fields: [vehicleId, activeEventId]
            name: by_vehicleId_and_activeEventId
          - fields: [trailerId, activeEventId]
            name: by_trailerId_and_activeEventId
        # Supply reads of convex/inventoryWindow.ts by the row's own date
        # (received, recorded, observed; else when it was made) instead of
        # save time with a margin, and supply rows by state.
        InventoryLot:
          - fields: [tenantId, receivedAt]
            name: by_tenantId_and_receivedAt
          # Recall search by lot-number prefix within the company only
          # (inventoryLots on production: 1 row, 2026-10-08).
          - fields: [tenantId, supplierLotNumber]
            name: by_tenantId_and_supplierLotNumber
        WasteRecord:
          - fields: [tenantId, recordedAt, createdAt]
            name: by_tenantId_and_recordedAt_and_createdAt
        IngredientPriceObservation:
          - fields: [tenantId, observedAt, createdAt]
            name: by_tenantId_and_observedAt_and_createdAt
        InventoryReservation:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        IngredientDemand:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        OpeningStockRecord:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
