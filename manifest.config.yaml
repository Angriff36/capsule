# Capsule Manifest project config (build-level).
# Schema: @angriff36/manifest/docs/spec/config/manifest.config.schema.json
#
# Convex authContextImport is required for tenant + policy IR (PB025).
# Builder convex-application preset v1.3.1 supplies the same option and emits
# convex/lib/authContext.ts as the author seam (identity not inlined into
# generated functions).

src: "src/**/*.manifest"
output: generated/ir

projections:
  convex:
    output: convex
    options:
      authContextImport: ./lib/authContext
      encryptionImport: ./lib/encryption
      eventHandlerImport: ./lib/operationalEvents
      # Org capability kill-switches: generated checkRole asks this seam
      # before the role hierarchy (roleAllows(user.role, ...) only).
      roleGateImport: ./lib/orgCapabilityGate
      policyMode: enforce
      includeTenantFilter: true
      # Fold resolved computeds into list/get returns (documented helpers|inline).
      # Default helpers requires callers to invoke convex/computed.ts; the event
      # menu UI reads estimatedCost/requiredCost/requiredBatches from listEvent rows.
      computedProperties: inline
      # Builder-only: stop emitting diagrams/** mermaid companions on regen.
      # Manifest still lists mermaid as a compatible companion; Capsule does not
      # want those files rebuilt (low product value / ownership noise).
      skipDocsDiagrams: true
      # Keep behavioral tests; omit generated function-existence checks.
      # Owner removed the 603 export-only smoke cases; do not regenerate them.
      skipContractTests: true
      # Composite indexes the domain needs but the grammar cannot declare.
      # StaffChatReadCursor: one row per (channel, account) — the upsert seam
      # convex/teamChatCursor.ts and every cursor read look the caller's row up
      # directly instead of filtering a channel-wide page.
      indexes:
        # Personal swap lookup: current staff and matching evidence/windows,
        # without scanning the tenant's historical schedule or private records.
        Person:
          - fields: [tenantId, status]
            name: by_tenantId_and_status
        Shift:
          - fields: [tenantId, personId, status, endsAt]
            name: by_staff_status_end
        TimeOffRequest:
          - fields: [tenantId, personId, status, endsAt]
            name: by_staff_status_end
        Qualification:
          - fields: [tenantId, personId, status, name, expiresAt]
            name: by_staff_certification_expiry
        TrainingCompletion:
          - fields: [tenantId, personId, trainingModuleId]
            name: by_staff_training_module
        ShiftSwapRequest:
          - fields: [recipientPersonId, status]
            name: by_recipientPersonId_and_status
        StaffChatReadCursor:
          - fields: [channelKey, authSubjectId]
            name: by_channelKey_and_authSubjectId
        # Team-chat files: the seam reads a message's attachments by parent AND
        # uploader, so a row someone else parks on the message id is never read.
        Attachment:
          - fields: [parentId, uploadedById]
            name: by_parentId_and_uploadedById
        # Catalog rows hold their primary image's storage id directly. The
        # orphan-blob check (convex/lib/blobs.ts) must find them by that id
        # before it deletes an unreferenced upload.
        Dish:
          - fields: [primaryImageStorageId]
            name: by_primaryImageStorageId
        Ingredient:
          - fields: [primaryImageStorageId]
            name: by_primaryImageStorageId
        # Invoice numbers are unique per tenant; the numbering seam
        # (convex/lib/invoiceNumbering.ts) checks a proposed number with a point
        # lookup instead of reading the tenant's invoice history.
        Invoice:
          - fields: [tenantId, invoiceNumber]
            name: by_tenantId_and_invoiceNumber
        # Ingredient totals per event: every contribution reaction sums one
        # ingredient's rows in one event. Reading the whole event 13 times per
        # contribution passed Convex's 16 MB read limit on a 15-dish BEO
        # import (2026-09-24). Manifest reads each sum through the declared
        # index covering the most equality predicates, i.e. this one.
        EventIngredientContribution:
          - fields: [eventId, ingredientId]
            name: by_eventId_and_ingredientId
